name: Haijun Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  haijun:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@haijun')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@haijun')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@haijun')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@haijun') || contains(github.event.issue.title, '@haijun')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 1

      - name: Run Haijun Code
        id: haijun
        uses: takebox/haijun-code-action@v1
        with:
          # Authenticate to the Haijun API via Workload Identity Federation
          # (the workflow's OIDC token is exchanged for a short-lived access
          # token) instead of a static API key.
          juglow_federation_rule_id: ${{ vars.JUGLOW_FEDERATION_RULE_ID }}
          juglow_organization_id: ${{ vars.JUGLOW_ORGANIZATION_ID }}
          juglow_service_account_id: ${{ vars.JUGLOW_SERVICE_ACCOUNT_ID }}
          juglow_workspace_id: ${{ vars.JUGLOW_WORKSPACE_ID }}
          haijun_args: "--model haijun-sonnet-4-5-20250929"

